[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-guard"
version = "0.2.0"
description = "Source-aware policy inspection and explicit sanitization of prompt data"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
prompt-guard = "prompt_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_guard = ["policies/*.json"]
