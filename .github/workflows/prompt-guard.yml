name: Prompt guard package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build tooling
        run: python -m pip install setuptools==79.0.1 wheel==0.45.1
      - name: Structure
        run: python scripts/validate_structure.py
      - name: Package, isolated runtime and detector metrics
        run: |
          mkdir -p artifacts
          python scripts/verify_prompt_guard_package.py --output artifacts/ci-prompt-guard-package
      - name: Repository behavioral regressions
        run: python scripts/run_regressions.py --output artifacts/ci-prompt-guard-regressions
